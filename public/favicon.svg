<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="READTRACK">
  <!-- Brutalist mark: a stack of books with a hard offset shadow and thick
       black borders, using the READTRACK palette (terracotta / gold / ink). -->
  <rect x="2" y="2" width="60" height="60" rx="6" fill="#f4f1ea" stroke="#111827" stroke-width="4"/>

  <!-- Hard offset shadow block behind the stack -->
  <g transform="translate(3 3)">
    <rect x="12" y="16" width="34" height="10" fill="#111827"/>
    <rect x="12" y="28" width="34" height="10" fill="#111827"/>
    <rect x="12" y="40" width="34" height="10" fill="#111827"/>
  </g>

  <!-- Book stack: three spines in brand colors with thick ink borders -->
  <rect x="12" y="16" width="34" height="10" fill="#DD614C" stroke="#111827" stroke-width="3"/>
  <rect x="12" y="28" width="34" height="10" fill="#DAA144" stroke="#111827" stroke-width="3"/>
  <rect x="12" y="40" width="34" height="10" fill="#16A34A" stroke="#111827" stroke-width="3"/>

  <!-- Spine detail lines (the "tracking" ticks) -->
  <rect x="40" y="19" width="3" height="4" fill="#111827"/>
  <rect x="40" y="31" width="3" height="4" fill="#111827"/>
  <rect x="40" y="43" width="3" height="4" fill="#111827"/>
</svg>
